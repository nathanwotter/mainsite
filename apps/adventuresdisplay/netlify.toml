# Separate Netlify project: set Base directory to apps/adventuresdisplay in its UI.
# Paths below are relative to that base. Do not attach to an existing project.
[build]
  command = "npm test && npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[build.environment]
  NODE_VERSION = "24"
  # Display mode is a public enum, not a credential; keep scanning all real secrets.
  SECRETS_SCAN_OMIT_KEYS = "ADVENTURESDISPLAY_MODE"

[dev]
  command = "npm run dev"
  targetPort = 4173
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://api.open-meteo.com; media-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "ffmpeg-static"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
