<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AdventuresDisplay · Household setup</title><link rel="stylesheet" href="/styles.css"><script defer src="/setup.js"></script></head><body><main class="admin-page"><h1>Your household frame.</h1><p>Create the administrator password for your private photographs and household information. This setup link expires and works only once.</p><form id="setup-form"><label>New administrator password<input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label><label>Confirm password<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label><p>Use at least 8 characters. Save it in your password manager.</p><button class="primary">Create administrator</button></form><p id="setup-status" role="status"></p><a href="/admin.html">Go to administration</a></main></body></html>
